<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Police MDT</title>
  <link rel="stylesheet" href="mdt-styles.css" />
</head>
<body>
  <div id="mdt-container" class="mdt-container hidden">
    <!-- Sidebar -->
    <aside class="mdt-sidebar">
      <div class="sidebar-header">PD/MDT</div>
      <div class="sidebar-menu">
        <button class="menu-item active" data-page="dashboard">Dashboard</button>
        <button class="menu-item" data-page="person-search">Person Search</button>
        <button class="menu-item" data-page="vehicle-search">Vehicle Search</button>
        <button class="menu-item" data-page="warrants">Warrants</button>
        <button class="menu-item" data-page="bolo">BOLO</button>
        <button class="menu-item" data-page="cases">Cases</button>
        <button class="menu-item" data-page="evidence">Evidence</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="mdt-main">
      <!-- Top Bar -->
      <header class="mdt-topbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search person or vehicle..." />
          <button id="search-btn" class="search-btn">SEARCH</button>
        </div>
        <div class="status-bar">
          <span class="unit-status">Unit 301</span>
          <span class="system-time" id="system-time">21:43</span>
        </div>
      </header>

      <!-- Page Container -->
      <div class="mdt-content">
        <!-- Dashboard Page -->
        <div id="page-dashboard" class="page active">
          <div class="page-title">Dashboard</div>
          <div class="dashboard-grid">
            <div class="dashboard-card">
              <div class="card-label">Active Calls</div>
              <div class="card-value" id="dash-calls">0</div>
            </div>
            <div class="dashboard-card">
              <div class="card-label">Warrants</div>
              <div class="card-value" id="dash-warrants">0</div>
            </div>
            <div class="dashboard-card">
              <div class="card-label">BOLO</div>
              <div class="card-value" id="dash-bolo">0</div>
            </div>
            <div class="dashboard-card">
              <div class="card-label">Cases</div>
              <div class="card-value" id="dash-cases">0</div>
            </div>
          </div>
          <div class="recent-activity">
            <div class="section-title">Recent Activity</div>
            <div id="recent-list" class="activity-list">
              <div class="activity-item">No recent activity</div>
            </div>
          </div>
        </div>

        <!-- Person Search Page -->
        <div id="page-person-search" class="page">
          <div class="page-title">Person Search</div>
          <div class="search-container">
            <input type="text" id="person-search-input" placeholder="Enter person name..." />
            <button id="person-search-btn" class="btn-primary">SEARCH</button>
          </div>
          <div id="person-results" class="results-container"></div>
        </div>

        <!-- Person Record Page -->
        <div id="page-person-record" class="page">
          <div class="page-title" id="record-title">Person Record</div>
          <div id="person-record-content" class="record-content"></div>
        </div>

        <!-- Vehicle Search Page -->
        <div id="page-vehicle-search" class="page">
          <div class="page-title">Vehicle Search</div>
          <div class="search-container">
            <input type="text" id="vehicle-search-input" placeholder="Enter license plate..." />
            <button id="vehicle-search-btn" class="btn-primary">SEARCH</button>
          </div>
          <div id="vehicle-results" class="results-container"></div>
        </div>

        <!-- Warrants Page -->
        <div id="page-warrants" class="page">
          <div class="page-title">Active Warrants</div>
          <div id="warrants-list" class="records-list"></div>
        </div>

        <!-- BOLO Page -->
        <div id="page-bolo" class="page">
          <div class="page-title">BOLO - Be On Lookout</div>
          <div id="bolo-list" class="records-list"></div>
        </div>

        <!-- Cases Page -->
        <div id="page-cases" class="page">
          <div class="page-title">Cases</div>
          <div id="cases-list" class="records-list"></div>
        </div>

        <!-- Evidence Page -->
        <div id="page-evidence" class="page">
          <div class="page-title">Evidence</div>
          <div id="evidence-list" class="records-list"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="mdt.js"></script>
</body>
</html>
